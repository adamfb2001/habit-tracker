<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Streaks</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Streaks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111110">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<script>
// apply the saved theme before first paint so there is no flash
(() => {
  let t = null; try { t = localStorage.getItem("theme"); } catch {}
  if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* Layout: single phone column (max 480px), cards on a plain ground, fixed bottom tab bar.
   Palette is exactly three colours: bone white, dark grey, and one mid grey readable on both.
   Surfaces and lines are mixes of bone and dark grey, never a new hue. Light/dark via [data-theme]. */
:root {
  --bone: #ece6da;
  --charcoal: #111110;
  --grey: #7e7b73;
  --font-display: "Sora", "Inter", system-ui, -apple-system, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
:root, [data-theme="dark"] {
  --bg: var(--charcoal);
  --surface: color-mix(in srgb, var(--bone) 6%, var(--charcoal));
  --surface-2: color-mix(in srgb, var(--bone) 11%, var(--charcoal));
  --line: color-mix(in srgb, var(--bone) 20%, var(--charcoal));
  --fg: var(--bone);
  --muted: var(--grey);
  --accent: var(--bone);
  --accent-ink: var(--charcoal);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: var(--bone);
  --surface: color-mix(in srgb, var(--charcoal) 5%, var(--bone));
  --surface-2: color-mix(in srgb, var(--charcoal) 10%, var(--bone));
  --line: color-mix(in srgb, var(--charcoal) 20%, var(--bone));
  --fg: var(--charcoal);
  --muted: var(--grey);
  --accent: var(--charcoal);
  --accent-ink: var(--bone);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 0;
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Header */
.top {
  display: flex; align-items: center; gap: 12px; min-height: 42px;
  /* stays pinned under the browser bar / status bar while scrolling */
  position: sticky; top: 0; z-index: 15;
  margin: 0 -16px -6px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.top h1 { font: 600 21px/1.15 var(--font-display); margin: 0; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.top h1 span { color: var(--muted); font-weight: 500; }
.theme-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); color: var(--fg); display: grid; place-items: center; flex: none; }

/* Cards */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-h h2 { font: 600 17px/1.2 var(--font-display); margin: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.pill-btn {
  min-height: 34px; padding: 0 14px; border-radius: 6px; background: var(--accent); color: var(--accent-ink);
  font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.ghost-btn { min-height: 34px; padding: 0 12px; border-radius: 6px; background: var(--surface-2); color: var(--fg); font-weight: 500; font-size: 14px; }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font: 600 19px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

/* Progress bar */
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }

/* Habit list */
.habits { display: flex; flex-direction: column; gap: 8px; }
.habit {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  min-height: 60px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2);
  transition: background .15s ease;
}
.habit .box {
  width: 30px; height: 30px; flex: none; border-radius: 5px; border: 2px solid var(--line);
  display: grid; place-items: center; transition: background .15s ease, border-color .15s ease;
  color: var(--accent-ink);
}
.habit .box svg { opacity: 0; transform: scale(.6); transition: .15s ease; }
.habit.done .box { background: var(--accent); border-color: var(--accent); }
.habit.done .box svg { opacity: 1; transform: none; }
.habit .name { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.habit.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.del { min-height: 34px; padding: 0 12px; border-radius: 6px; background: transparent; border: 1.5px solid var(--fg); color: var(--fg); font-weight: 600; font-size: 13px; flex: none; }

.add-row { display: flex; gap: 8px; }
.add-row input {
  flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); font-size: 16px;
}
.add-row input::placeholder { color: var(--muted); }
.add-row .pill-btn { min-height: 46px; padding: 0 18px; }
/* Shopping-list checklist */
.checklist { padding: 4px 16px; gap: 0; }
.item {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--line);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.item:last-child { border-bottom: 0; }
.item .box {
  width: 26px; height: 26px; flex: none; border-radius: 5px; border: 2px solid var(--muted);
  display: grid; place-items: center; color: var(--accent-ink); transition: background .15s ease, border-color .15s ease;
}
.item .box svg { opacity: 0; transform: scale(.6); transition: .15s ease; }
.item.done .box { background: var(--accent); border-color: var(--accent); }
.item.done .box svg { opacity: 1; transform: none; }
.item .name { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
.item.done .name { color: var(--muted); text-decoration: line-through; }
.item.confirm { gap: 8px; }
.item.confirm .name { font-size: 15px; }

.add-bar {
  width: 100%; min-height: 52px; border-radius: 8px; border: 1.5px dashed var(--line);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--muted); font-weight: 600; font-size: 15px;
}
.add-bar svg { flex: none; }
.add-row .x { width: 46px; min-height: 46px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--fg); }

/* Mini 10-day line chart */
.mini-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.mini-h .link { color: var(--fg); font-size: 14px; font-weight: 600; min-height: 36px; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }
.mini-h:has(.link) { align-items: center; }
.line svg { display: block; width: 100%; height: auto; overflow: visible; }
.line text { font: 600 10px var(--font-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.line text.on { fill: var(--fg); }
.line .hit { fill: transparent; cursor: pointer; }
.sample { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.sample button { color: var(--fg); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 36px; padding: 0 4px; }

/* Heatmap */
.heat-wrap { display: flex; flex-direction: column; gap: 4px; }
.heat-months, .heat { display: grid; grid-template-columns: 14px repeat(var(--weeks), 1fr); column-gap: 3px; }
.heat { grid-template-rows: repeat(7, auto); grid-auto-flow: column; row-gap: 3px; }
.heat-months span { font-size: 10px; color: var(--muted); white-space: nowrap; }
.heat .lbl { font-size: 9px; color: var(--muted); line-height: 1; align-self: center; }
.cell { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); position: relative; }
.cell::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--fg); opacity: var(--o, 0); }
.cell.future { background: transparent; }
.cell.today { box-shadow: 0 0 0 1.5px var(--fg); }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; color: var(--muted); }
.legend .cell { width: 11px; }

/* Chart */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 6px; padding: 3px; gap: 2px; }
.seg button { min-height: 30px; padding: 0 11px; border-radius: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg.wide { display: grid; grid-template-columns: repeat(4, 1fr); }
.readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 13px; min-height: 20px; }
.readout .d { color: var(--muted); }
.readout b { font-variant-numeric: tabular-nums; }
#chart { width: 100%; touch-action: pan-y; }
#chart svg { display: block; width: 100%; height: auto; }
#chart text { fill: var(--muted); font: 10px var(--font-body); font-variant-numeric: tabular-nums; }
.goal-line { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.tag b { color: var(--fg); font-weight: 600; }

/* Compare */
.theme-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.cmp { gap: 10px; }
.cmp-h { display: flex; align-items: center; gap: 14px; font-size: 13px; font-weight: 600; }
.cmp-h .link, .mini-h .link { color: var(--fg); font-size: 14px; font-weight: 600; min-height: 36px; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 16px; height: 3px; border-radius: 2px; display: block; background: var(--fg); }
.key i.fr { background: repeating-linear-gradient(90deg, var(--muted) 0 5px, transparent 5px 8px); }
.cmp p { margin: 0; font-size: 14px; }
.cmp-t { font: 600 16px/1.3 var(--font-display); }
.cmp-row { display: flex; gap: 8px; }
.cmp-row input, .share-url { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.cmp-row input::placeholder { color: var(--muted); }
.cmp-row .pill-btn, .cmp-row .ghost-btn { min-height: 44px; flex: none; }
.cmp .del { align-self: flex-start; }
.flash { font-weight: 600; }
.stat em, .gov em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.mini-h b.hi { color: var(--fg); font-weight: 600; }
.who { font-size: 12px; font-weight: 600; color: var(--muted); align-self: center; min-width: 34px; }
.heat-wrap.fr .cell::after { background: var(--muted); }
.heat-wrap.fr .cell.today { box-shadow: 0 0 0 1.5px var(--muted); }
.fr-goal .bar > i { background: var(--muted); }
.fr-goal .item.done .box { background: var(--muted); border-color: var(--muted); }

/* Goals */
.govs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gov { background: var(--surface); border-radius: var(--radius); padding: 10px 10px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; border: 1.5px solid transparent; }
.gov small { font-size: 12px; color: var(--muted); font-weight: 600; }
.gov b { font: 600 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.gov .bar { width: 100%; height: 5px; }
.gov[aria-pressed="true"] { border-color: var(--fg); }
.gtitle { font: 600 19px/1.25 var(--font-display); margin: -6px 0 0; overflow-wrap: anywhere; }
.mslist { display: flex; flex-direction: column; }
.gform { display: flex; flex-direction: column; gap: 8px; }
.gform input { min-height: 46px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; width: 100%; min-width: 0; }
.gform input::placeholder { color: var(--muted); }
.gform input[aria-invalid="true"] { border-color: var(--fg); border-width: 2px; }
.ms-in { display: flex; align-items: center; gap: 10px; }
.ms-in span { width: 22px; flex: none; text-align: center; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.gform-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.gform-actions .pill-btn { min-height: 42px; padding: 0 18px; }
.pnav { display: flex; align-items: center; gap: 10px; }
.pnav .arrow { width: 40px; height: 40px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.pnav .mid { flex: 1; text-align: center; min-width: 0; }
.pnav .mid b { display: block; font: 600 17px/1.2 var(--font-display); }
.pnav .mid small { color: var(--muted); font-size: 12px; }
.goal { display: flex; align-items: center; gap: 10px; }
.goal .habit { flex: 1; min-width: 0; }

/* Notices and empty states */
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.notice b { font: 600 16px/1.3 var(--font-display); }
.empty { text-align: center; padding: 22px 8px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { color: var(--fg); font: 600 16px/1.3 var(--font-display); }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }
.tabbar button[aria-current="page"] { color: var(--accent); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabbar"><nav id="tabs"></nav></div>

<script>
(() => {
  const DATA_KEY = "dailyStreaks.v1";
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const SCOPES = { w: "Weekly", m: "Monthly", y: "Yearly" };
  const SCOPE_NOW = { w: "This week", m: "This month", y: "This year" };

  const ICON = {
    check: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    home: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1h-4.5v-5.5h-5V20H5a1 1 0 01-1-1v-8.5z" fill="currentColor"/></svg>',
    board: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="12" width="4" height="8" rx="1.2" fill="currentColor"/><rect x="10" y="7" width="4" height="13" rx="1.2" fill="currentColor"/><rect x="16" y="4" width="4" height="16" rx="1.2" fill="currentColor"/></svg>',
    flag: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 21V4m0 0h11l-2.5 4L17 12H6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    left: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    sun: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><path d="M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    moon: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M16.5 12.4A7 7 0 017.6 3.5a7 7 0 108.9 8.9z" fill="currentColor"/></svg>',
    compare: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="7" cy="6.5" r="3" fill="currentColor"/><path d="M1.5 16.5c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14" cy="6" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M14.6 10.6c2 .3 3.3 1.7 3.9 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    plus: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    close: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    right: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M7 4l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const blank = () => ({ v: 1, habits: [], log: {}, goals: {} });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
  };

  // sample tasks and ~4 months of history so a first visit shows what the app looks like
  function sampleData() {
    const habits = [["Gym / workout", .7], ["Read 20 minutes", .8], ["Drink 2L water", .85], ["Walk 8,000 steps", .6], ["Meditate 10 min", .5]]
      .map(([name, p], i) => ({ id: "s" + i, name, p }));
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const log = {}, t = today();
    for (let i = 1; i <= 120; i++) {
      const d = addDays(t, -i), weekend = d.getDay() === 0 || d.getDay() === 6;
      const ids = habits.filter(h => rnd() < h.p - (weekend ? .2 : 0)).map(h => h.id);
      if (ids.length) log[keyOf(d)] = ids;
    }
    log[keyOf(t)] = ["s1", "s2"];
    return { v: 1, sample: true, habits: habits.map(({ id, name }) => ({ id, name })), log, goals: sampleGoals() };
  }

  function sampleGoals() {
    const g = (title, ms) => ({ title, ms: ms.map(([text, done]) => ({ text, done })) });
    return {
      [period("w", 0).key]: g("Get back into running", [["Run 3 km on Monday", true], ["Run 4 km midweek", true], ["Run 5 km at the weekend", false]]),
      [period("m", 0).key]: g("Read two books", [["Finish the first book", true], ["Start the second book", false], ["Finish the second book", false]]),
      [period("y", 0).key]: g("Run a half marathon", [["Sign up for a race", true], ["Run 15 km in training", false], ["Finish the half marathon", false]])
    };
  }

  // one goal per period, each with exactly 3 milestones; older saves kept a list of objectives
  function normGoal(v) {
    if (!v) return null;
    if (Array.isArray(v)) {
      if (!v.length) return null;
      v = { title: v[0].text || "", ms: v.slice(1, 4).map(x => ({ text: x.text || "", done: !!x.done })) };
    }
    const ms = (Array.isArray(v.ms) ? v.ms : []).slice(0, 3).map(x => ({ text: String(x.text || ""), done: !!x.done }));
    while (ms.length < 3) ms.push({ text: "", done: false });
    return { title: String(v.title || ""), ms };
  }

  function load() {
    let d = null;
    try { d = JSON.parse(store.get(DATA_KEY)); } catch {}
    const empty = !d || typeof d !== "object" || (!(d.habits || []).length && !Object.keys(d.log || {}).length && !Object.keys(d.goals || {}).length);
    if (empty && store.get("sampleCleared") !== "1") { d = sampleData(); store.set(DATA_KEY, JSON.stringify(d)); }
    if (!d || typeof d !== "object") d = blank();
    d.habits = Array.isArray(d.habits) ? d.habits : [];
    d.log = d.log && typeof d.log === "object" ? d.log : {};
    d.goals = d.goals && typeof d.goals === "object" ? d.goals : {};
    for (const k of Object.keys(d.goals)) { const g = normGoal(d.goals[k]); if (g) d.goals[k] = g; else delete d.goals[k]; }
    if (d.sample && !Object.keys(d.goals).length) { d.goals = sampleGoals(); store.set(DATA_KEY, JSON.stringify(d)); }
    return d;
  }

  // ---------- state ----------
  const S = {
    tab: ["today", "board", "goals"].includes(store.get("tab")) ? store.get("tab") : "today",
    data: load(),
    day: keyOf(today()),
    editing: false, confirmDel: null, adding: false,
    range: 30, hover: null,
    gScope: "w", gOffset: 0, gEdit: false,
    compare: store.get("compare") === "1", cmpPanel: false, cmpErr: false, shareUrl: "", flash: "",
    saveErr: false
  };

  const dayCount = k => (S.data.log[k] || []).length;
  const doneOn = k => { const set = new Set(S.data.log[k] || []); return S.data.habits.filter(h => set.has(h.id)).length; };
  function streak() {
    let d = today(), n = 0;
    if (!dayCount(keyOf(d))) d = addDays(d, -1);
    while (dayCount(keyOf(d)) > 0) { n++; d = addDays(d, -1); }
    return n;
  }
  function bestStreak() {
    const keys = Object.keys(S.data.log).filter(k => S.data.log[k].length).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      const d = new Date(k + "T00:00:00");
      run = prev && keyOf(addDays(prev, 1)) === k ? run + 1 : 1;
      best = Math.max(best, run); prev = d;
    }
    return best;
  }
  function rate(days) {
    const n = S.data.habits.length; if (!n) return 0;
    let sum = 0;
    for (let i = 0; i < days; i++) sum += Math.min(n, dayCount(keyOf(addDays(today(), -i))));
    return Math.round(100 * sum / (n * days));
  }

  function period(scope, offset) {
    const t = today();
    if (scope === "w") {
      const start = addDays(t, -((t.getDay() + 6) % 7) + offset * 7), end = addDays(start, 6);
      const label = offset === 0 ? "This week" : offset === -1 ? "Last week" : offset === 1 ? "Next week" : "Week of " + start.getDate() + " " + MON[start.getMonth()];
      return { key: "w:" + keyOf(start), label, sub: start.getDate() + " " + MON[start.getMonth()] + " – " + end.getDate() + " " + MON[end.getMonth()], end };
    }
    if (scope === "m") {
      const d = new Date(t.getFullYear(), t.getMonth() + offset, 1);
      return { key: "m:" + d.getFullYear() + "-" + pad(d.getMonth() + 1), label: MONTH[d.getMonth()] + " " + d.getFullYear(), sub: offset === 0 ? "This month" : "", end: new Date(d.getFullYear(), d.getMonth() + 1, 0) };
    }
    if (scope === "q") {
      const idx = t.getFullYear() * 4 + Math.floor(t.getMonth() / 3) + offset, y = Math.floor(idx / 4), q = idx % 4;
      return { key: "q:" + y + "-" + (q + 1), label: "Q" + (q + 1) + " " + y, sub: MON[q * 3] + " – " + MON[q * 3 + 2] + (offset === 0 ? " · this quarter" : ""), end: new Date(y, q * 3 + 3, 0) };
    }
    const y = t.getFullYear() + offset;
    return { key: "y:" + y, label: String(y), sub: offset === 0 ? "This year" : "", end: new Date(y, 11, 31) };
  }
  const goalAt = key => S.data.goals[key] || null;
  const msDone = g => g ? g.ms.filter(m => m.done).length : 0;

  // ---------- friend comparison ----------
  // A friend's progress arrives as a link they share from their own copy of the app. The link holds a
  // small snapshot (tasks done per day, their goals); nothing is uploaded anywhere.
  const FRIEND_KEY = "dailyStreaks.friend", SHARE_DAYS = 200;
  const b64e = str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const b64d = str => { str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "="; return new TextDecoder().decode(Uint8Array.from(atob(str), c => c.charCodeAt(0))); };
  const fmtDay = k => { const d = new Date(k + "T00:00:00"); return d.getDate() + " " + MON[d.getMonth()]; };

  function shareCode(name) {
    const t = today(); let c = "";
    for (let i = 0; i < SHARE_DAYS; i++) c += Math.min(35, doneOn(keyOf(addDays(t, -i)))).toString(36);
    const g = {};
    for (const sc of Object.keys(SCOPES)) for (let o = -2; o <= 1; o++) {
      const k = period(sc, o).key, gl = goalAt(k);
      if (gl) g[k] = [gl.title, ...gl.ms.map(m => m.text), gl.ms.map(m => m.done ? 1 : 0).join("")];
    }
    return b64e(JSON.stringify({ v: 1, n: name, a: keyOf(t), t: S.data.habits.length, c: c.replace(/0+$/, ""), g }));
  }
  function parseFriend(input) {
    try {
      const str = String(input || "").trim();
      const m = str.match(/#f=([A-Za-z0-9_-]+)/) || str.match(/^([A-Za-z0-9_-]{8,})$/);
      if (!m) return null;
      const p = JSON.parse(b64d(m[1]));
      if (!p || p.v !== 1 || typeof p.c !== "string" || !/^\d{4}-\d\d-\d\d$/.test(p.a)) return null;
      const anchor = new Date(p.a + "T00:00:00"), log = {};
      [...p.c].forEach((ch, i) => { const n = parseInt(ch, 36); if (n) log[keyOf(addDays(anchor, -i))] = n; });
      const goals = {};
      Object.entries(p.g || {}).forEach(([k, a]) => {
        if (Array.isArray(a) && a.length >= 5) goals[k] = { title: String(a[0]), ms: [1, 2, 3].map(i => ({ text: String(a[i]), done: String(a[4])[i - 1] === "1" })) };
      });
      return { name: String(p.n || "Friend").slice(0, 30), asOf: p.a, total: Math.max(0, +p.t || 0), log, goals };
    } catch { return null; }
  }
  function sampleFriend() {
    let seed = 99; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const t = today(), log = {};
    for (let i = 0; i < SHARE_DAYS; i++) {
      const d = addDays(t, -i), weekend = d.getDay() % 6 === 0;
      let n = 0; for (let h = 0; h < 4; h++) if (rnd() < (weekend ? .75 : .55)) n++;
      if (i === 0) n = 3;
      if (n) log[keyOf(d)] = n;
    }
    const g = (title, ms, done) => ({ title, ms: ms.map((text, i) => ({ text, done: done[i] })) });
    return { name: "Sam", sample: true, asOf: keyOf(t), total: 4, log, goals: {
      [period("w", 0).key]: g("Sleep before midnight", ["In bed by 12, Mon–Tue", "In bed by 12, Wed–Thu", "Keep it up at the weekend"], [true, false, false]),
      [period("m", 0).key]: g("Cook at home more", ["Plan a weekly menu", "Cook 10 dinners", "Cook 20 dinners"], [true, true, false]),
      [period("y", 0).key]: g("Learn to swim properly", ["Book lessons", "Swim 25 m non-stop", "Swim 1 km"], [true, true, false])
    } };
  }
  function loadFriend() { try { const f = JSON.parse(store.get(FRIEND_KEY)); if (f && f.log && f.asOf) return f; } catch {} return null; }
  function saveFriend(f) { friendCache = f; store.set(FRIEND_KEY, f ? JSON.stringify(f) : ""); }
  let friendCache = loadFriend(), sampleFriendCache = null;
  const friend = () => friendCache || (S.data.sample ? (sampleFriendCache = sampleFriendCache || sampleFriend()) : null);
  const cmpOn = () => S.compare && !!friend();
  const fName = () => friend().name;
  const fCount = k => { const f = friend(); return k > f.asOf ? null : (f.log[k] || 0); };  // null = after their snapshot
  const pctOf = (c, n) => c == null ? null : n ? Math.round(100 * Math.min(1, c / n)) : 0;
  function fStreak() {
    const f = friend(); let d = new Date(f.asOf + "T00:00:00"), n = 0;
    if (!f.log[keyOf(d)]) d = addDays(d, -1);
    while (f.log[keyOf(d)]) { n++; d = addDays(d, -1); }
    return n;
  }
  function fBest() {
    const ks = Object.keys(friend().log).sort(); let b = 0, r = 0, p = null;
    for (const k of ks) { r = p && keyOf(addDays(p, 1)) === k ? r + 1 : 1; b = Math.max(b, r); p = new Date(k + "T00:00:00"); }
    return b;
  }
  function fRate(days) {
    const f = friend(); if (!f.total) return 0;
    const a = new Date(f.asOf + "T00:00:00"); let sum = 0;
    for (let i = 0; i < days; i++) sum += Math.min(f.total, f.log[keyOf(addDays(a, -i))] || 0);
    return Math.round(100 * sum / (f.total * days));
  }
  const vs = v => cmpOn() ? `<em>${esc(fName())} ${v}</em>` : "";

  // opened from a friend's share link: keep their snapshot and switch compare on
  if (location.hash.startsWith("#f=")) {
    const f = parseFriend(location.hash);
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    if (f) { saveFriend(f); S.compare = true; store.set("compare", "1"); S.flash = `Added ${f.name}'s progress`; }
  }

  // ---------- saving (on this device) ----------
  function commit() {
    S.data.updated = new Date().toISOString();
    S.saveErr = !store.set(DATA_KEY, JSON.stringify(S.data));
    render();
  }

  // ---------- render ----------
  const app = document.getElementById("app");
  const tabs = document.getElementById("tabs");

  function render() {
    // keep focus and typed text across re-renders
    const a = document.activeElement, focusId = a && a.id, val = a && a.value, sel = a && a.selectionStart;
    const drafts = {}; app.querySelectorAll("input[id]").forEach(i => drafts[i.id] = i.value);

    app.innerHTML = header() + body();
    tabs.innerHTML = [["today", "Today", ICON.home], ["board", "Board", ICON.board], ["goals", "Goals", ICON.flag]]
      .map(([k, l, ic]) => `<button data-act="tab:${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ic}<span>${l}</span></button>`).join("");

    app.querySelectorAll("input[id]").forEach(i => { if (drafts[i.id] != null) i.value = drafts[i.id]; });
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (val != null && el.setSelectionRange) try { el.setSelectionRange(sel, sel); } catch {} } }
    if (S.tab === "board") drawChart();
  }

  function header() {
    const t = today();
    const title = S.tab === "today" ? `Today<span>, ${t.getDate()} ${MON[t.getMonth()]}</span>` : S.tab === "board" ? "Board" : "Goals";
    const dark = document.documentElement.dataset.theme !== "light";
    const themeBtn = `<button class="theme-btn" data-act="theme" aria-label="Switch to ${dark ? "light" : "dark"} theme">${dark ? ICON.sun : ICON.moon}</button>`;
    const cmpBtn = `<button class="theme-btn" data-act="compare" aria-pressed="${S.compare}" aria-label="Compare with a friend">${ICON.compare}</button>`;
    return `<header class="top"><h1>${title}</h1>${cmpBtn}${themeBtn}</header>`;
  }

  function body() {
    const n = S.saveErr ? `<div class="notice"><b>Couldn't save</b><span class="muted">This browser isn't letting the page store data. If you're in private browsing, open it in a normal tab.</span></div>` : "";
    const c = comparePanel();
    if (S.tab === "board") return n + c + boardView();
    if (S.tab === "goals") return n + c + goalsView();
    return n + c + todayView();
  }

  function comparePanel() {
    if (!S.compare) return "";
    const f = friend(), real = !!friendCache, open = S.cmpPanel || !f;
    const flash = S.flash ? `<small class="flash">${esc(S.flash)}</small>` : "";
    const head = f ? `<div class="cmp-h"><span class="key"><i></i>You</span><span class="key"><i class="fr"></i>${esc(f.name)}${f.sample ? " (sample)" : ""}</span>
      <span style="flex:1"></span><button class="link" data-act="cmppanel">${open ? "Close" : real ? "Update" : "Add friend"}</button></div>` : "";
    if (!open) return `<section class="card cmp">${head}${real ? `<small class="muted">${esc(f.name)}'s progress as of ${fmtDay(f.asOf)}</small>` : ""}${flash}</section>`;
    return `<section class="card cmp">${head}
      ${f ? "" : `<b class="cmp-t">Compare with a friend</b>`}
      <p class="muted">Share a link to your progress with your friend and ask them to share theirs from their app. Each link is a snapshot, so swap new ones to stay up to date.</p>
      <form class="cmp-row" id="shareForm" autocomplete="off"><input id="myName" maxlength="30" placeholder="Your name" aria-label="Your name" value="${esc(store.get("myName") || "")}"><button class="pill-btn" type="submit">Share my progress</button></form>
      ${S.shareUrl ? `<input class="share-url" id="shareUrl" readonly aria-label="Your share link" value="${esc(S.shareUrl)}">` : ""}
      <form class="cmp-row" id="friendForm" autocomplete="off"><input id="friendLink" placeholder="Paste your friend's link" aria-label="Your friend's link"><button class="ghost-btn" type="submit">Add</button></form>
      ${S.cmpErr ? `<small>That link doesn't look right. Copy the whole link and try again.</small>` : ""}
      ${flash}
      ${real ? `<button class="del" data-act="cmpremove">${S.confirmDel === "__friend" ? "Tap again to remove" : "Remove " + esc(f.name)}</button>` : ""}
    </section>`;
  }

  // ----- Today -----
  function todayView() {
    const habits = S.data.habits;
    const t = today();
    const sel = S.day, selDate = new Date(sel + "T00:00:00");
    const done = doneOn(sel), total = habits.length;

    const dayLabel = sel === keyOf(t) ? "Today" : sel === keyOf(addDays(t, -1)) ? "Yesterday" : DOW[selDate.getDay()] + " " + selDate.getDate() + " " + MON[selDate.getMonth()];

    // last 10 days as a line chart, one point per day; tap a day to see its checklist
    const days10 = Array.from({ length: 10 }, (_, i) => addDays(t, i - 9));
    const cmp = cmpOn();
    const vals = days10.map(d => cmp ? pctOf(doneOn(keyOf(d)), total) : doneOn(keyOf(d)));
    const fvals = cmp ? days10.map(d => pctOf(fCount(keyOf(d)), friend().total)) : [];
    const VW = 320, VH = 124, PL = 12, PR = 12, PT = 20, PB = 22;
    const yMax = cmp ? 100 : Math.max(1, total, ...vals);
    const px = i => PL + i * (VW - PL - PR) / 9, py = v => PT + (VH - PT - PB) * (1 - v / yMax);
    const pts = vals.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`);
    let line = `<svg viewBox="0 0 ${VW} ${VH}" role="group" aria-label="Tasks completed, last 10 days">
      <line x1="${PL}" x2="${VW - PR}" y1="${py(yMax)}" y2="${py(yMax)}" stroke="var(--line)" stroke-dasharray="2 4"/>
      <line x1="${PL}" x2="${VW - PR}" y1="${py(0)}" y2="${py(0)}" stroke="var(--line)"/>
      <path d="M${pts.join("L")}L${px(9)},${py(0)}L${px(0)},${py(0)}Z" fill="var(--fg)" opacity=".07"/>`;
    if (cmp) {
      const fp = fvals.map((v, i) => v == null ? null : `${px(i).toFixed(1)},${py(v).toFixed(1)}`).filter(Boolean);
      if (fp.length) line += `<path d="M${fp.join("L")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
      fvals.forEach((v, i) => { if (v != null) line += `<circle cx="${px(i)}" cy="${py(v)}" r="${keyOf(days10[i]) === sel ? 4.5 : 3}" fill="var(--muted)" stroke="var(--surface)" stroke-width="1.5"/>`; });
    }
    line += `<path d="M${pts.join("L")}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    days10.forEach((d, i) => {
      const k = keyOf(d), on = k === sel, x = px(i), y = py(vals[i]);
      line += on
        ? `<circle cx="${x}" cy="${y}" r="6" fill="var(--fg)" stroke="var(--surface)" stroke-width="2.5"/>`
        : `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/>`;
      if (!cmp) line += `<text x="${x}" y="${y - 10}" text-anchor="middle" class="${on ? "on" : ""}">${vals[i]}</text>`;
      line += `<text x="${x}" y="${VH - 5}" text-anchor="middle" class="${on ? "on" : ""}">${d.getDate()}</text>`;
      line += `<rect class="hit" x="${x - (VW - PL - PR) / 18}" y="0" width="${(VW - PL - PR) / 9}" height="${VH}" data-act="day:${k}"><title>${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}: ${vals[i]} done</title></rect>`;
    });
    line += `</svg>`;

    // shopping-list style: tick box + name, nothing else. Press and hold a row to remove it.
    const logSet = new Set(S.data.log[sel] || []);
    const list = habits.length ? `<section class="card checklist">${habits.map(h => {
      if (S.confirmDel === h.id) {
        return `<div class="item confirm"><span class="name">Remove “${esc(h.name)}”?</span>
          <button class="del" data-act="del:${esc(h.id)}">Remove</button><button class="ghost-btn" data-act="delcancel">Cancel</button></div>`;
      }
      const isDone = logSet.has(h.id);
      return `<button class="item ${isDone ? "done" : ""}" data-act="toggle:${esc(h.id)}" data-hold="${esc(h.id)}" aria-pressed="${isDone}">
        <span class="box">${ICON.check}</span><span class="name">${esc(h.name)}</span></button>`;
    }).join("")}</section>` : "";

    const adder = S.adding
      ? `<form class="add-row" id="habitForm" autocomplete="off"><input id="habitInput" maxlength="60" placeholder="New daily task" enterkeyhint="done" aria-label="New daily task"><button class="pill-btn" type="submit">Add</button><button class="x" type="button" data-act="addclose" aria-label="Cancel">${ICON.close}</button></form>`
      : `<button class="add-bar" data-act="addopen">${ICON.plus}<span>Add daily task</span></button>`;

    return `
      <section class="card">
        <div class="mini-h">
          <div class="eyebrow">${esc(dayLabel)}</div>
          <span class="muted" style="font-size:13px">${cmp ? (() => { const i = days10.findIndex(d => keyOf(d) === sel); return i < 0 ? "" : `You <b class="hi">${vals[i]}%</b> · ${esc(fName())} <b class="hi">${fvals[i] == null ? "–" : fvals[i] + "%"}</b>`; })() : total ? `${done} of ${total} done` : "last 10 days"}</span>
        </div>
        <div class="line">${line}</div>
      </section>
      ${list}
      ${adder}
      ${S.data.sample ? `<div class="sample">Showing sample data <button data-act="clearsample">${S.confirmDel === "__sample" ? "Tap again to clear" : "Clear it"}</button></div>` : ""}
      <section class="stats">
        <div class="stat"><b>${streak()}</b><small>day streak</small>${cmp ? vs(fStreak()) : ""}</div>
        <div class="stat"><b>${bestStreak()}</b><small>best streak</small>${cmp ? vs(fBest()) : ""}</div>
        <div class="stat"><b>${rate(30)}%</b><small>last 30 days</small>${cmp ? vs(fRate(30) + "%") : ""}</div>
      </section>
      <section class="card">
        <div class="card-h"><h2>${cmp ? "Your consistency" : "Consistency"}</h2><span class="muted" style="font-size:13px">last 18 weeks</span></div>
        ${heatmap()}
      </section>
      ${cmp ? `<section class="card">
        <div class="card-h"><h2>${esc(fName())}'s consistency</h2><span class="muted" style="font-size:13px">last 18 weeks</span></div>
        ${heatmap(k => fCount(k) || 0, friend().total, true)}
      </section>` : ""}`;
  }

  // ----- Heatmap -----
  function heatmap(count = dayCount, n = S.data.habits.length, isFriend = false) {
    const W = 18, t = today();
    const start = addDays(t, -t.getDay() - (W - 1) * 7);
    let months = `<span></span>`, lastM = -1;
    for (let w = 0; w < W; w++) {
      const d = addDays(start, w * 7), m = d.getMonth();
      if (m !== lastM && (w > 0 || d.getDate() <= 7)) { months += `<span style="grid-column:${w + 2} / span 3">${MON[m]}</span>`; }
      lastM = m;
    }
    const lbls = ["", "M", "", "W", "", "F", ""].map(l => `<span class="lbl">${l}</span>`).join("");
    let cells = "";
    for (let i = 0; i < W * 7; i++) {
      const d = addDays(start, i), k = keyOf(d);
      if (d > t) { cells += `<span class="cell future"></span>`; continue; }
      const c = count(k), f = c ? c / Math.max(n, c, 1) : 0;
      const o = f === 0 ? 0 : [0.3, 0.5, 0.75, 1][Math.min(3, Math.ceil(f * 4) - 1)];
      cells += `<span class="cell ${k === keyOf(t) ? "today" : ""}" style="--o:${o}" title="${d.getDate()} ${MON[d.getMonth()]}: ${c} done"></span>`;
    }
    const legend = [0, .3, .5, .75, 1].map(o => `<span class="cell" style="--o:${o}"></span>`).join("");
    return `<div class="heat-wrap ${isFriend ? "fr" : ""}" style="--weeks:${W}">
      <div class="heat-months">${months}</div>
      <div class="heat">${lbls}${cells}</div>
      <div class="legend">Less ${legend} More</div></div>`;
  }

  // ----- Board -----
  function boardView() {
    const wk = period("w", 0), mo = period("m", 0);
    const g = (key, l) => { const gl = goalAt(key); return gl ? `<span class="tag">${l} goal <b>${msDone(gl)}/3</b></span>` : ""; };
    const tags = g(wk.key, "Week") + g(mo.key, "Month") + g(period("y", 0).key, "Year");
    const cmp = cmpOn();
    const fg = (key, l) => { const gl = cmp && friend().goals[key]; return gl ? `<span class="tag">${l} <b>${msDone(gl)}/3</b></span>` : ""; };
    const ftags = cmp ? fg(wk.key, "Week") + fg(mo.key, "Month") + fg(period("y", 0).key, "Year") : "";
    return `
      <section class="card">
        <div class="card-h"><h2>${cmp ? "Completion per day" : "Tasks per day"}</h2>
          <div class="seg" role="group" aria-label="Range">${[7, 30, 90].map(r => `<button data-act="range:${r}" aria-pressed="${S.range === r}">${r}d</button>`).join("")}</div></div>
        <div class="readout" id="readout"></div>
        <div id="chart"></div>
      </section>
      <section class="stats">
        <div class="stat"><b>${streak()}</b><small>day streak</small>${cmp ? vs(fStreak()) : ""}</div>
        <div class="stat"><b>${rate(7)}%</b><small>this week</small>${cmp ? vs(fRate(7) + "%") : ""}</div>
        <div class="stat"><b>${rate(90)}%</b><small>90 days</small>${cmp ? vs(fRate(90) + "%") : ""}</div>
      </section>
      ${tags ? `<div class="goal-line">${cmp ? `<span class="who">You</span>` : ""}${tags}</div>` : ""}
      ${ftags ? `<div class="goal-line"><span class="who">${esc(fName())}</span>${ftags}</div>` : ""}`;
  }

  function drawChart() {
    const box = document.getElementById("chart"); if (!box) return;
    const R = S.range, W = Math.max(280, box.clientWidth || 340), H = 190;
    const cmp = cmpOn(), n = S.data.habits.length;
    const L = cmp ? 34 : 26, Rp = 10, T = 10, B = 24;
    const days = Array.from({ length: R }, (_, i) => addDays(today(), i - R + 1));
    const vals = days.map(d => cmp ? pctOf(doneOn(keyOf(d)), n) : dayCount(keyOf(d)));
    const fvals = cmp ? days.map(d => pctOf(fCount(keyOf(d)), friend().total)) : [];
    const max = cmp ? 100 : Math.max(1, ...vals);
    const step = cmp ? 25 : max <= 5 ? 1 : max <= 10 ? 2 : Math.ceil(max / 5);
    const yMax = Math.ceil(max / step) * step;
    const x = i => L + (R === 1 ? 0 : i * (W - L - Rp) / (R - 1));
    const y = v => T + (H - T - B) * (1 - v / yMax);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per day, last ${R} days">`;
    for (let v = 0; v <= yMax; v += step) {
      s += `<line x1="${L}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v ? 'stroke-dasharray="2 4"' : ""}/>`;
      s += `<text x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${v}${cmp ? "%" : ""}</text>`;
    }
    const ticks = R === 7 ? days.map((_, i) => i) : [0, Math.round((R - 1) / 3), Math.round(2 * (R - 1) / 3), R - 1];
    ticks.forEach(i => {
      const d = days[i], lab = R === 7 ? DOW[d.getDay()].slice(0, 1) : d.getDate() + " " + MON[d.getMonth()];
      const anchor = R === 7 ? "middle" : i === 0 ? "start" : i === R - 1 ? "end" : "middle";
      s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${anchor}">${lab}</text>`;
    });
    const hi = S.hover == null ? R - 1 : S.hover;
    s += `<line x1="${x(hi)}" x2="${x(hi)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>`;
    const c = "var(--fg)";
    if (cmp) {
      const fp = fvals.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
      if (fp.length) s += `<path d="M${fp.join("L")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
      if (R === 7) fvals.forEach((v, i) => { if (v != null) s += `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="var(--muted)"/>`; });
      if (fvals[hi] != null) s += `<circle cx="${x(hi)}" cy="${y(fvals[hi])}" r="4.5" fill="var(--muted)" stroke="var(--surface)" stroke-width="2"/>`;
    }
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    s += `<path d="M${pts.join("L")}L${x(R - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${c}" opacity=".1"/>`;
    s += `<path d="M${pts.join("L")}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (R === 7) vals.forEach((v, i) => s += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}"/>`);
    s += `<circle cx="${x(hi)}" cy="${y(vals[hi])}" r="5" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`;
    s += `</svg>`;
    box.innerHTML = s;

    const d = days[hi];
    document.getElementById("readout").innerHTML =
      `<span class="d">${hi === R - 1 ? "Today" : DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]}</span>` +
      (cmp ? `<span class="key"><i></i>You <b>${vals[hi]}%</b></span><span class="key"><i class="fr"></i>${esc(fName())} <b>${fvals[hi] == null ? "–" : fvals[hi] + "%"}</b></span>`
           : `<span><b>${vals[hi]}</b> done</span>`);

    const svg = box.querySelector("svg");
    const pick = e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
      const i = Math.round((px - L) / ((W - L - Rp) / Math.max(1, R - 1)));
      const ni = Math.max(0, Math.min(R - 1, i));
      if (ni !== S.hover) { S.hover = ni; drawChart(); }
    };
    svg.addEventListener("pointerdown", pick);
    svg.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "mouse") pick(e); });
  }

  // ----- Goals -----
  // Weekly / monthly / yearly: one goal per period, each broken into 3 milestones to tick off
  function goalsView() {
    const per = period(S.gScope, S.gOffset), g = goalAt(per.key);
    let left = "";
    if (S.gOffset === 0) {
      const days = Math.round((per.end - today()) / 864e5) + 1;
      left = days === 1 ? "Last day" : days + " days left";
    }

    // overview of the current week, month and year; tap one to open it
    const overview = Object.keys(SCOPES).map(sc => {
      const og = goalAt(period(sc, 0).key), n = msDone(og);
      return `<button class="gov" data-act="gscope:${sc}" aria-pressed="${S.gScope === sc}">
        <small>${SCOPES[sc]}</small><b>${og ? n + "/3" : "–"}</b>
        <span class="bar"><i style="width:${og ? Math.round(100 * n / 3) : 0}%"></i></span>
        ${cmpOn() ? (() => { const fg = friend().goals[period(sc, 0).key]; return `<em>${esc(fName())} ${fg ? msDone(fg) + "/3" : "–"}</em>`; })() : ""}</button>`;
    }).join("");

    const sfx = per.key.replace(/[^a-z0-9]/gi, "_");
    let content;
    if (S.gEdit || !g) {
      const fresh = !g;
      content = `<form class="gform" id="goalForm" autocomplete="off" data-key="${esc(per.key)}">
        <label class="eyebrow" for="gT_${sfx}">${SCOPES[S.gScope]} goal</label>
        <input id="gT_${sfx}" maxlength="80" placeholder="What do you want to achieve?" value="${esc(g ? g.title : "")}">
        <span class="eyebrow" style="margin-top:6px">3 milestones</span>
        ${[0, 1, 2].map(i => `<div class="ms-in"><span>${i + 1}</span><input id="gM${i}_${sfx}" maxlength="80" placeholder="Milestone ${i + 1}" aria-label="Milestone ${i + 1}" value="${esc(g ? g.ms[i].text : "")}"></div>`).join("")}
        <div class="gform-actions">
          ${fresh ? "" : `<button type="button" class="del" data-act="gremove">${S.confirmDel === "__goal" ? "Tap again to remove" : "Remove goal"}</button>`}
          <span style="flex:1"></span>
          ${fresh ? "" : `<button type="button" class="ghost-btn" data-act="gcancel">Cancel</button>`}
          <button type="submit" class="pill-btn">${fresh ? "Set goal" : "Save"}</button>
        </div>
      </form>`;
    } else {
      const n = msDone(g);
      content = `<div class="mini-h"><span class="eyebrow">${n === 3 ? "Goal complete" : n + " of 3 milestones"}</span><button class="link" data-act="gedit">Edit</button></div>
        <h2 class="gtitle">${esc(g.title || "Untitled goal")}</h2>
        <div class="bar"><i style="width:${Math.round(100 * n / 3)}%"></i></div>
        <div class="mslist">${g.ms.map((m, i) => `<button class="item ${m.done ? "done" : ""}" data-act="gms:${i}" aria-pressed="${m.done}">
          <span class="box">${ICON.check}</span><span class="name">${esc(m.text || "Milestone " + (i + 1))}</span></button>`).join("")}</div>`;
    }

    let friendGoal = "";
    if (cmpOn()) {
      const fg = friend().goals[per.key], word = S.gScope === "w" ? "week" : S.gScope === "m" ? "month" : "year";
      friendGoal = `<section class="card fr-goal">
        <div class="mini-h"><span class="eyebrow">${esc(fName())}'s ${SCOPES[S.gScope].toLowerCase()} goal</span>${fg ? `<span class="muted" style="font-size:13px">${msDone(fg)} of 3</span>` : ""}</div>
        ${fg ? `<h2 class="gtitle">${esc(fg.title)}</h2>
          <div class="bar"><i style="width:${Math.round(100 * msDone(fg) / 3)}%"></i></div>
          <div class="mslist">${fg.ms.map(m => `<div class="item ${m.done ? "done" : ""}"><span class="box">${ICON.check}</span><span class="name">${esc(m.text)}</span></div>`).join("")}</div>`
          : `<p class="muted" style="margin:0">${esc(fName())} hasn't shared a goal for this ${word}.</p>`}
      </section>`;
    }

    return `
      <div class="govs" role="group" aria-label="Goal period">${overview}</div>
      <section class="card">
        <div class="pnav">
          <button class="arrow" data-act="gprev" aria-label="Previous period">${ICON.left}</button>
          <div class="mid"><b>${esc(per.label)}</b><small>${esc([per.sub, left].filter(Boolean).join(" · "))}</small></div>
          <button class="arrow" data-act="gnext" aria-label="Next period">${ICON.right}</button>
        </div>
        ${content}
      </section>
      ${friendGoal}`;
  }

  // ---------- actions ----------
  // press and hold a checklist row (~0.5s) to ask whether to remove it
  let holdTimer = null, holdXY = null, held = false;
  const endHold = () => { clearTimeout(holdTimer); holdTimer = null; };
  document.addEventListener("pointerdown", e => {
    held = false;
    const row = e.target.closest("[data-hold]"); if (!row) return;
    holdXY = [e.clientX, e.clientY];
    holdTimer = setTimeout(() => {
      held = true; S.confirmDel = row.dataset.hold; S.adding = false;
      if (navigator.vibrate) navigator.vibrate(15);
      render();
    }, 500);
  });
  document.addEventListener("pointermove", e => {
    if (holdTimer && holdXY && Math.hypot(e.clientX - holdXY[0], e.clientY - holdXY[1]) > 10) endHold();
  });
  ["pointerup", "pointercancel", "scroll"].forEach(t => document.addEventListener(t, endHold, true));
  document.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });

  document.addEventListener("click", e => {
    if (held) { held = false; e.preventDefault(); return; }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const [act, ...rest] = b.dataset.act.split(":"); const arg = rest.join(":");
    if (act !== "del" && act !== "gremove" && act !== "clearsample" && act !== "cmpremove") S.confirmDel = null;
    S.flash = "";
    switch (act) {
      case "tab": S.tab = arg; S.editing = false; S.hover = null; store.set("tab", arg); window.scrollTo(0, 0); break;
      case "day": S.day = arg; break;
      case "edit": S.editing = !S.editing; S.adding = false; break;
      case "addopen": S.adding = true; render(); { const i = document.getElementById("habitInput"); if (i) i.focus(); } return;
      case "addclose": S.adding = false; break;
      case "delcancel": S.confirmDel = null; break;
      case "clearsample": {
        if (S.confirmDel !== "__sample") { S.confirmDel = "__sample"; break; }
        S.confirmDel = null; S.data = blank(); store.set("sampleCleared", "1"); commit(); return;
      }
      case "theme": {
        const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = next; store.set("theme", next); syncThemeColor(); break;
      }
      case "range": S.range = +arg; S.hover = null; break;
      case "gscope": S.gScope = arg; S.gOffset = 0; S.gEdit = false; break;
      case "gprev": S.gOffset--; S.gEdit = false; break;
      case "gnext": S.gOffset++; S.gEdit = false; break;
      case "gedit": S.gEdit = true; break;
      case "compare": S.compare = !S.compare; store.set("compare", S.compare ? "1" : "0"); S.cmpPanel = false; S.cmpErr = false; S.hover = null; break;
      case "cmppanel": S.cmpPanel = !(S.cmpPanel || !friend()); S.cmpErr = false; break;
      case "cmpremove": {
        if (S.confirmDel !== "__friend") { S.confirmDel = "__friend"; break; }
        S.confirmDel = null; saveFriend(null); S.cmpPanel = false; break;
      }
      case "gcancel": S.gEdit = false; break;
      case "gms": {
        const g = goalAt(period(S.gScope, S.gOffset).key);
        if (g && g.ms[+arg]) { g.ms[+arg].done = !g.ms[+arg].done; commit(); } return;
      }
      case "gremove": {
        if (S.confirmDel !== "__goal") { S.confirmDel = "__goal"; break; }
        delete S.data.goals[period(S.gScope, S.gOffset).key]; S.confirmDel = null; S.gEdit = false; commit(); return;
      }
      case "toggle": {
        const log = S.data.log, arr = log[S.day] || [];
        log[S.day] = arr.includes(arg) ? arr.filter(x => x !== arg) : [...arr, arg];
        if (!log[S.day].length) delete log[S.day];
        commit(); return;
      }
      case "del": {
        if (S.confirmDel !== arg) { S.confirmDel = arg; break; }
        S.data.habits = S.data.habits.filter(h => h.id !== arg); S.confirmDel = null;
        if (!S.data.habits.length) S.editing = false;
        commit(); return;
      }
    }
    render();
  });

  function addHabit(name) {
    name = (name || "").trim().slice(0, 60);
    if (!name) return;
    if (S.data.habits.some(h => h.name.toLowerCase() === name.toLowerCase())) return;
    S.data.habits.push({ id: uid(), name, created: keyOf(today()) });
    commit();
  }

  document.addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id === "habitForm") {
      const i = document.getElementById("habitInput"); const v = i.value; i.value = ""; addHabit(v);
    } else if (e.target.id === "shareForm") {
      const name = (document.getElementById("myName").value || "").trim().slice(0, 30) || "Friend";
      store.set("myName", name);
      const url = location.origin + location.pathname + "#f=" + shareCode(name);
      S.shareUrl = url; render();
      if (navigator.share) navigator.share({ title: "My Daily Streaks progress", url }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { S.flash = "Link copied"; render(); }).catch(() => {});
    } else if (e.target.id === "friendForm") {
      const inp = document.getElementById("friendLink"), f = parseFriend(inp.value);
      if (!f) { S.cmpErr = true; render(); return; }
      inp.value = ""; saveFriend(f); S.cmpErr = false; S.cmpPanel = false; S.flash = `Added ${f.name}'s progress`; render();
    } else if (e.target.id === "goalForm") {
      const key = e.target.dataset.key, sfx = key.replace(/[^a-z0-9]/gi, "_");
      const inputs = [document.getElementById("gT_" + sfx), ...[0, 1, 2].map(i => document.getElementById(`gM${i}_${sfx}`))];
      const empty = inputs.find(i => !i.value.trim());
      if (empty) { empty.focus(); empty.setAttribute("aria-invalid", "true"); return; }
      const old = goalAt(key);
      S.data.goals[key] = {
        title: inputs[0].value.trim().slice(0, 80),
        ms: [1, 2, 3].map(i => {
          const text = inputs[i].value.trim().slice(0, 80), prev = old && old.ms[i - 1];
          return { text, done: !!(prev && prev.text === text && prev.done) };
        })
      };
      S.gEdit = false; commit();
    }
  });

  function syncThemeColor() {
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = document.documentElement.dataset.theme === "light" ? "#ece6da" : "#111110";
  }

  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.tab === "board" && drawChart(), 120); });
  // other tabs/windows of the app keep in step; a new day re-renders on return
  addEventListener("storage", e => { if (e.key === DATA_KEY) { S.data = load(); render(); } });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { S.data = load(); friendCache = loadFriend(); render(); } });

  syncThemeColor();
  render();
})();
</script>
</body>
</html>
